<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBCE07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Mentari Housekeeping</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:Jost;font-weight:300;font-display:swap;src:url(jost-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:400;font-display:swap;src:url(jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;font-display:swap;src:url(jost-latin-500-normal.woff2) format('woff2')}
:root{--y:#FBCE07;--r:#DD1D21;--ink:#1d1d1d;--grey:#6b6b6b;--line:#e4e4e0;--soft:#f6f6f3;--ok:#2e7d32;--late:#d98200;--bad:#c62828;--bg:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.45 Jost,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
[hidden]{display:none!important}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px 8px;border-top:4px solid var(--y);max-width:760px;margin:0 auto}
.brand{font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:15px;line-height:1.35;cursor:pointer}
.brand b{display:block;font-weight:500;color:var(--ink)}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#ver{font-size:12px;color:var(--grey);letter-spacing:.08em}
.lang{display:flex}
.lang button{border:1px solid var(--line);background:#fff;padding:3px 9px;font:500 12px Jost,sans-serif;letter-spacing:.08em;color:var(--grey);cursor:pointer;margin-left:-1px}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
main.hasTabs{padding-bottom:96px}
h1.title{font-weight:300;text-transform:uppercase;letter-spacing:.22em;color:var(--grey);font-size:20px;margin:16px 0 10px;line-height:1.3}
h2{font-weight:500;font-size:17px;margin:20px 0 8px}
h3{font-weight:500;font-size:15px;margin:0 0 4px}
p{margin:6px 0}
.sub,.muted{color:var(--grey);font-size:14px}
.stack>*{margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:block;width:100%;padding:15px 16px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font:500 16px Jost,sans-serif;letter-spacing:.04em;text-align:left;cursor:pointer}
.btn.p{background:var(--y);border-color:var(--y)}
.btn.d{color:var(--r);border-color:var(--r)}
.btn.s{padding:9px 12px;font-size:14px;width:auto;display:inline-block}
.btn.c{text-align:center}
.btn small{display:block;font-weight:400;color:#444;letter-spacing:0}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--ink);text-decoration:underline;font:400 14px Jost,sans-serif;padding:4px 0;cursor:pointer}
.card{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0;background:#fff}
.card.y{border-left:4px solid var(--y)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;white-space:nowrap;background:#fff}
.s-done{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
.s-late{background:#fff3e0;border-color:#ffcc80;color:#8a4b00}
.s-missed{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.s-due{background:#fffde7;border-color:var(--y);color:#5c4d00;font-weight:500}
.s-pending{color:var(--grey)}
.st-open{background:#ffebee;border-color:#ef9a9a;color:#b71c1c}
.st-inprogress{background:#fff3e0;border-color:#ffcc80;color:#8a4b00}
.st-closed{background:#e8f5e9;border-color:#a5d6a7;color:#1b5e20}
label{display:block;font-size:12px;letter-spacing:.1em;color:var(--grey);margin:14px 0 4px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfcfca;border-radius:4px;font:400 16px Jost,sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.banner{padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.banner.warn{background:#fff3e0;border:1px solid #ffcc80}
.banner.bad{background:#ffebee;border:1px solid #ef9a9a}
.banner.info{background:var(--soft);border:1px solid var(--line)}
.banner.ok{background:#e8f5e9;border:1px solid #a5d6a7}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg button{flex:1 1 0;min-width:86px;padding:12px 6px;border:1px solid #cfcfca;background:#fff;border-radius:4px;font:500 14px Jost,sans-serif;color:var(--ink);cursor:pointer}
.seg button.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.warn{background:var(--late);border-color:var(--late);color:#fff}
.seg button.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item .q{font-weight:500}
.item .nb{margin-top:8px}
.sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;padding:12px 4px 10px;border:0;background:none;font:500 12px Jost,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--grey);cursor:pointer}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--y)}
.badge{background:var(--r);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px;letter-spacing:0}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.grid{border-collapse:collapse;font-size:11px;min-width:100%}
.grid th,.grid td{border:1px solid #eee;text-align:center;padding:0;min-width:27px;height:32px;font-weight:400}
.grid th{height:26px;color:var(--grey);background:#fafaf8}
.grid th.today{background:var(--y);color:var(--ink);font-weight:500}
.grid th.rl,.grid td.rl{position:sticky;left:0;background:#fff;text-align:left;padding:4px 8px;min-width:104px;max-width:128px;z-index:1;font-size:12px;border-right:2px solid var(--line);line-height:1.25}
.grid th.rl{background:#fafaf8}
.grid td.rl small{display:block;color:var(--grey);font-size:10.5px}
.grid .c-done{background:#c8e6c9;color:#1b5e20}
.grid .c-late{background:#ffe0b2;color:#8a4b00}
.grid .c-missed{background:#ffcdd2;color:#b71c1c}
.grid .c-due{background:#fff59d}
.grid .c-off{background:repeating-linear-gradient(45deg,#f1f1ee,#f1f1ee 4px,#fafaf8 4px,#fafaf8 8px)}
.grid .tm,.grid .by{display:none}
.grid td[data-act]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--grey);margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border:1px solid #ddd;vertical-align:-3px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:300;letter-spacing:.04em}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.lo{background:var(--bad)}.bar i.mid{background:var(--late)}
.scanner{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.scanner video{flex:1;object-fit:cover;width:100%;min-height:0}
.scanner .frame{position:absolute;left:50%;top:42%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:3px solid var(--y);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.scanner .sbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,.65);color:#fff}
.scanner .sbar .btn{background:#fff;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.modal .box{background:#fff;width:100%;max-width:560px;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.modal img{max-width:100%;border-radius:6px;display:block;margin:8px auto}
.preview{max-width:100%;max-height:220px;border-radius:6px;margin-top:8px;display:block}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90vw;text-align:center;font-size:14px}
#toast.show{opacity:1}
#busy{position:fixed;top:0;left:0;height:3px;width:0;background:var(--r);z-index:90}
body.busy #busy{width:75%;transition:width 8s cubic-bezier(.1,.7,.2,1)}
.label-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.label{border:2px solid var(--ink);border-radius:8px;padding:14px;text-align:center;break-inside:avoid;background:#fff}
.label svg{width:64%;max-width:220px;height:auto;display:block;margin:0 auto 8px}
.label h3{font-size:19px;letter-spacing:.04em;margin:4px 0}
.label .code{font-size:12px;color:var(--grey);letter-spacing:.12em}
.label .ln{font-size:13px;margin-top:6px}
.label .bar2{height:6px;background:var(--y);margin:-14px -14px 12px;border-radius:6px 6px 0 0}
.print-only{display:none}
@media (max-width:420px){.label-grid{grid-template-columns:1fr}}
@media print{
  header.top .lang,nav.tabs,.noprint,#toast,#busy{display:none!important}
  body{font-size:12px}
  main{max-width:none;padding:0 4px}
  .grid .tm,.grid .by{display:block;font-size:8px;line-height:1.1;color:#333}
  .grid td{height:36px}
  .gridwrap{overflow:visible;border:0}
  .grid th.rl,.grid td.rl{position:static}
  .print-only{display:block}
  .label-grid{gap:8mm}
}
</style>
<style id="pagecss">@page{size:A4 landscape;margin:10mm}</style>

function roundName(r) { return S.lang === 'id' ? r.nameId : S.lang === 'ms' ? r.nameMs : r.nameEn; }
VIEWS.room = async function (tok) {
  var cfg = await ensureCfg(); if (tok !== S.rtok) return;
  var p = S.params, room = cfg.rooms.filter(function (r) { return r.roomId === p.roomId; })[0];
  if (!room) { setApp('<div class="banner bad">' + t('err_notfound') + '</div><button class="btn c" data-act="home">' + t('home') + '</button>'); return; }
  var month = p.month || cfg.today.slice(0, 7);
  setApp('<p class="muted">' + t('loading') + '</p>');
  var d;
  try { d = await api('roomMonth', { roomId: room.roomId, month: month }); }
  catch (e) { if (e && e.code === 'old' && p.month) { toast(errMsg(e)); S.params.month = cfg.today.slice(0, 7); return render(); } throw e; }
  if (tok !== S.rtok) return;
  S.roomData = d;
  var curM = cfg.today.slice(0, 7), todayD = +cfg.today.slice(8, 10);
  var head = '<tr><th class="rl">' + esc(t('round')) + '</th>' + d.days.map(function (x) { return '<th class="' + (month === curM && x.d === todayD ? 'today' : '') + '">' + x.d + '</th>'; }).join('') + '</tr>';
  var body = d.rounds.map(function (r) {
    return '<tr><td class="rl">' + esc(roundName(r)) + '<small>' + r.start + ' – ' + r.end + '</small></td>' + d.days.map(function (x) {
      var c = x.cells[r.roundId];
      if (!c) return '<td class="c-off"></td>';
      var sym = c.s === 'done' || c.s === 'late' ? '✓' : c.s === 'missed' ? '✗' : c.s === 'due' ? '•' : '';
      return '<td class="c-' + c.s + '" data-act="cell" data-d="' + x.d + '" data-r="' + esc(r.roundId) + '">' + sym + (c.t ? '<span class="tm">' + c.t + '</span>' : '') + (c.by ? '<span class="by">' + esc(c.by) + '</span>' : '') + '</td>';
    }).join('') + '</tr>';
  }).join('');
  var tot = d.totals;
  setApp(backBtn() + '<h1 class="title">' + esc(nm(room)) + '</h1>' +
    '<div class="row noprint"><button class="btn s" data-act="month" data-d="-1">←</button><b>' + esc(monthName(month)) + '</b><button class="btn s" data-act="month" data-d="1"' + (month >= curM ? ' disabled' : '') + '>→</button></div>' +
    '<div class="print-only"><b>Mentari Housekeeping</b> · ' + esc(nm(room)) + ' · ' + esc(monthName(month)) + '</div>' +
    '<div class="stats"><div class="stat"><b>' + (tot.pct === null ? '–' : tot.pct + '%') + '</b><span>' + t('completed') + '</span></div><div class="stat"><b>' + tot.done + '/' + tot.due + '</b><span>' + t('completed') + ' ' + t('of') + '</span></div><div class="stat"><b>' + tot.late + ' · ' + tot.missed + '</b><span>' + t('late') + ' · ' + t('missed') + '</span></div></div>' +
    '<div class="gridwrap"><table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
    '<div id="cellinfo" class="muted" style="min-height:22px;margin-top:6px"></div>' +
    '<div class="legend"><span><i style="background:#c8e6c9"></i>' + t('lg_done') + '</span><span><i style="background:#ffe0b2"></i>' + t('lg_late') + '</span><span><i style="background:#ffcdd2"></i>' + t('lg_missed') + '</span><span><i style="background:#fff59d"></i>' + t('lg_due') + '</span><span><i style="background:#fff"></i>' + t('lg_pending') + '</span><span><i style="background:repeating-linear-gradient(45deg,#f1f1ee,#f1f1ee 3px,#fafaf8 3px,#fafaf8 6px)"></i>' + t('lg_off') + '</span></div>' +
    '<div class="stack noprint"><button class="btn p" data-act="reportroom" data-id="' + esc(room.roomId) + '">' + t('report_here') + '</button>' +
    '<button class="btn" data-act="call" data-room="' + esc(room.roomId) + '">' + t('call_btn') + '</button>' +
    '<button class="btn c" data-act="print">' + t('print') + '</button>' +
    '<button class="btn c" data-act="staff">' + (S.user ? t('btn_staff_open') : t('staff_login')) + '</button>' +
    '<p class="muted">' + t('scan_note') + '</p></div>');
};

function drawPhoto(id, val, live, set) {
  var el = $('#' + id); if (!el) return;
  el.innerHTML = (val ? '<img class="preview" src="' + val + '" alt="">' : '') +
    '<div class="wrap" style="margin-top:8px"><button class="btn s" data-photo="1">' + (val ? t('change_photo') : t('take_photo')) + '</button>' + (val ? '<button class="btn s" data-unphoto="1">' + t('remove') + '</button>' : '') + '</div>';
  el.querySelector('[data-photo]').onclick = function () { unlockAudio(); pickPhoto(live, function (v) { set(v); drawPhoto(id, v, live, set); }); };
  var u = el.querySelector('[data-unphoto]'); if (u) u.onclick = function () { set(null); drawPhoto(id, null, live, set); };
}

function stateChip(c) {
  var sym = { done: '✓', late: '✓', missed: '✗', due: '●', pending: '○' }[c.s];
  return '<span class="chip s-' + c.s + '">' + sym + ' ' + esc(c.roundId) + ' ' + esc(c.start) + (c.t ? ' · ' + esc(c.t) : '') + '</span>';
}
function roomCards(rooms) {
  var groups = {}, order = [];
  rooms.forEach(function (r) { if (!groups[r.location]) { groups[r.location] = []; order.push(r.location); } groups[r.location].push(r); });
  return order.map(function (g) {
    return '<h2>' + esc(g) + '</h2>' + groups[g].map(function (r) {
      return '<div class="card"><div class="row"><b>' + esc(nm(r)) + '</b></div><div class="wrap" style="margin-top:6px">' + r.cells.map(stateChip).join('') + '</div></div>';
    }).join('');
  }).join('');
}
async function tabToday(tok) {
  var d = await api('today'); if (tok !== S.rtok) return;
  var due = 0, missed = 0, done = 0, total = 0;
  d.rooms.forEach(function (r) { r.cells.forEach(function (c) { total++; if (c.s === 'done' || c.s === 'late') done++; else if (c.s === 'due') due++; else if (c.s === 'missed') missed++; }); });
  var msg = '';
  if (d.holiday) msg += '<div class="banner info">' + t('holiday') + ': ' + esc(d.holiday) + '</div>';
  if (!total) msg += '<div class="banner info">' + t('no_rounds') + '</div>';
  else {
    if (due) msg += '<div class="banner warn"><b>' + t('due_now') + ':</b> ' + due + '</div>';
    if (missed) msg += '<div class="banner bad"><b>' + t('overdue') + ':</b> ' + missed + '</div>';
    if (!due && !missed) msg += '<div class="banner ok">' + t('on_track') + '</div>';
  }
  setApp('<h1 class="title">' + t('tab_today') + '</h1><button class="btn p" data-act="scan">' + t('scan_btn') + '<small>' + t('scan_hint') + '</small></button>' + msg +
    (total ? '<p class="muted">' + t('today_progress') + ': <b>' + done + ' ' + t('of') + ' ' + total + '</b></p>' : '') + roomCards(d.rooms));
}
async function refreshTodayQuiet() {
  try { var d = await api('today'); if (S.view !== 'staff' || S.params.tab !== 'today') return; var y = window.scrollY; await tabToday(S.rtok); window.scrollTo(0, y); } catch (e) {}
}

/* ---- concerns ---- */
async function tabConcerns(tok) {
  var j = await api('concerns'); if (tok !== S.rtok) return;
  S.concerns = j.concerns;
  var f = S.cf = S.cf || 'Open';
  var cnt = { 'Open': 0, 'In Progress': 0, 'Closed': 0 };
  j.concerns.forEach(function (c) { cnt[c.status]++; });
  var list = j.concerns.filter(function (c) { return c.status === f; });
  var filt = [['Open', 'f_open'], ['In Progress', 'f_prog'], ['Closed', 'f_closed']].map(function (x) {
    return '<button class="chip' + (f === x[0] ? ' st-' + stKey(x[0]) : '') + '" data-act="cfilter" data-f="' + x[0] + '" style="cursor:pointer;font:500 14px Jost,sans-serif;padding:6px 12px">' + t(x[1]) + ' (' + cnt[x[0]] + ')</button>';
  }).join('');
  setApp('<h1 class="title">' + t('concerns_title') + '</h1><div class="wrap">' + filt + '</div>' + (list.length ? list.map(concernCard).join('') : '<p class="muted">' + t('none_here') + '</p>'));
}
function concernCard(c) {
  var act = '';
  if (c.status === 'Open') act += '<button class="btn s" data-act="cstart" data-ref="' + esc(c.ref) + '">' + t('act_start') + '</button> ';
  if (c.status !== 'Closed') act += '<button class="btn s p" data-act="cclose" data-ref="' + esc(c.ref) + '">' + t('act_close') + '</button>';
  if (c.status === 'Closed' && isMgr()) act += '<button class="btn s" data-act="creopen" data-ref="' + esc(c.ref) + '">' + t('act_reopen') + '</button>';
  return '<div class="card"><div class="row"><b>' + esc(c.ref) + '</b><span class="chip st-' + stKey(c.status) + '">' + esc(stName(c.status)) + '</span></div>' +
    '<div>' + esc(nm(c.room)) + ' · ' + esc(catName(c.category)) + '</div>' +
    '<div class="muted">' + dt(c.ts) + ' · ' + (c.source === 'Inspection' ? t('from_insp') : t('from_person')) + (c.reporter ? ' · ' + esc(c.reporter) : '') + '</div>' +
    '<p>' + esc(c.text) + '</p>' +
    (c.photoId ? '<button class="link" data-act="showphoto" data-id="' + esc(c.photoId) + '">' + t('view_photo') + '</button> ' : '') +
    (c.afterPhotoId ? '<button class="link" data-act="showphoto" data-id="' + esc(c.afterPhotoId) + '">' + t('view_after') + '</button>' : '') +
    (c.closeNote ? '<div class="muted">' + esc(c.closeNote) + '</div>' : '') +
    (c.handledBy ? '<div class="muted">' + t('handled_by') + ': ' + esc(c.handledBy) + '</div>' : '') +
    (act ? '<div class="wrap" style="margin-top:8px">' + act + '</div>' : '') + '</div>';
}

async function tabStock(tok) {
  if (!S.cache.inv) { var j = await api('inventory'); S.cache.inv = j.items; }
  if (tok !== S.rtok) return;
  var g = S.sg = S.sg || 'snacks';
  setApp('<h1 class="title">' + t('stock_title') + '</h1><div class="seg"><button data-act="sgroup" data-g="snacks" class="' + (g === 'snacks' ? 'sel ok' : '') + '">' + t('snacks') + '</button><button data-act="sgroup" data-g="other" class="' + (g === 'other' ? 'sel ok' : '') + '">' + t('other') + '</button></div>' +

  drawStock();
}
function drawStock() {
  var q = (($('#stk_q') || {}).value || '').toLowerCase(), g = S.sg, groups = {}, order = [];
  S.cache.inv.filter(function (i) { return i.group === g && (!q || (i.nameId + ' ' + i.nameEn).toLowerCase().indexOf(q) >= 0); }).forEach(function (i) {
    var parts = i.category.split(' | '), cat = S.lang === 'en' ? parts[0] : (parts[1] || parts[0]);
    if (!groups[cat]) { groups[cat] = []; order.push(cat); } groups[cat].push(i);
  });
  $('#stk_list').innerHTML = order.map(function (c) {
    return '<h2>' + esc(c) + '</h2><div class="card" style="padding:4px 14px">' + groups[c].map(function (i) {
      var main = S.lang === 'en' ? i.nameEn : i.nameId, sub = S.lang === 'en' ? i.nameId : i.nameEn;
      return '<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div>' + esc(main) + (sub && sub !== main ? '<div class="muted" style="font-size:12px">' + esc(sub) + '</div>' : '') + (i.note ? '<div class="muted" style="font-size:12px">' + esc(i.note) + '</div>' : '') + '</div><span class="chip">' + (i.qty ? esc(i.qty) : '–') + '</span></div>';
    }).join('') + '</div>';
  }).join('') || '<p class="muted">' + t('none_here') + '</p>';
}
ACT.sgroup = function (el) { S.sg = el.dataset.g; render(); };
INP.stockq = function () { drawStock(); };

}

/* ===================== scanner ===================== */
function parseRoomQr(text) {
  try {
    var u = new URL(String(text).trim());
    var room = u.searchParams.get('room'), k = u.searchParams.get('k');
    if (room && k) return { roomId: room, key: k };
  } catch (e) {}
  return null;
}
ACT.scan = function () {
  unlockAudio();
  var wrap = document.createElement('div'); wrap.className = 'scanner';
  wrap.innerHTML = '<video playsinline muted></video><div class="frame"></div><div class="sbar"><div id="sc_msg">' + esc(t('scan_point')) + '</div>' +
    '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:13px;opacity:.8">' + esc(t('paste_qr')) + '</summary><div class="wrap" style="margin-top:6px"><input id="sc_paste" style="flex:1"><button class="btn s" id="sc_go" style="background:#fff">' + esc(t('go')) + '</button></div></details>' +
    '<button class="btn c" id="sc_cancel">' + esc(t('scan_cancel')) + '</button></div>';
  document.body.appendChild(wrap);
  var video = wrap.querySelector('video'), stream = null, alive = true, det = null, canvas = document.createElement('canvas'), busyScan = false;
  function stop() { alive = false; try { if (stream) stream.getTracks().forEach(function (tr) { tr.stop(); }); } catch (e) {} if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  cleanups.push(stop);
  async function got(text) {
    if (!alive || busyScan) return;
    var q = parseRoomQr(text);
    if (!q) { $('#sc_msg').textContent = t('scan_bad'); setTimeout(function () { if (alive) $('#sc_msg').textContent = t('scan_point'); busyScan = false; }, 1800); busyScan = true; return; }
    busyScan = true; stop();
    try { await beginInspection(q); } catch (e) { toast(errMsg(e)); }
  }
  wrap.querySelector('#sc_cancel').onclick = stop;
  wrap.querySelector('#sc_go').onclick = function () { got($('#sc_paste').value); };
  if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
  var tick = async function () {
    if (!alive) return;
    try {
      if (video.readyState >= 2 && video.videoWidth) {
        if (det) {
          var r = await det.detect(video);
          if (r && r.length) { await got(r[0].rawValue); }
        } else if (typeof jsQR === 'function') {
          var w = Math.min(640, video.videoWidth), h = Math.round(w * video.videoHeight / video.videoWidth);
          canvas.width = w; canvas.height = h;
          var cx = canvas.getContext('2d', { willReadFrequently: true }); cx.drawImage(video, 0, 0, w, h);
          var d = cx.getImageData(0, 0, w, h), c = jsQR(d.data, w, h, { inversionAttempts: 'dontInvert' });
          if (c && c.data) await got(c.data);
        }
      }
    } catch (e) {}
    if (alive) setTimeout(tick, 180);
  };
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) {
    if (!alive) { s.getTracks().forEach(function (tr) { tr.stop(); }); return; }
    stream = s; video.srcObject = s; video.play().catch(function () {}); tick();
  }).catch(function () { var m = $('#sc_msg'); if (m) m.textContent = t('cam_fail'); });
};

/* ===================== inspection ===================== */
async function beginInspection(q) {
  var j = await api('startInspection', { roomId: q.roomId, key: q.key });
  S.ins = { data: j, token: j.startToken, answers: {}, notes: {}, photo: null, note: '', t0: Date.now() };
  go('inspect');
}
var OPTS = {
  check: [['done', 'opt_done', 'ok'], ['notdone', 'opt_notdone', 'bad'], ['action', 'opt_action', 'bad']],
  refill: [['present', 'opt_present', 'ok'], ['refill', 'opt_refill', 'warn']],
  mmc: [['clean', 'opt_clean', 'ok'], ['cleaned', 'opt_cleaned', 'warn'], ['action', 'opt_action', 'bad']]
};
function itemText(it) { return it[S.lang] || it.en; }
function needsNote(v) { return v === 'notdone' || v === 'action'; }
VIEWS.inspect = function () {
  var I = S.ins; if (!I) { go('staff', { tab: 'today' }, true); return; }
  var d = I.data, room = d.room;
  var badge = d.windowStatus === 'Extra' ? '<div class="banner warn">' + t('extra') + '</div>' : d.windowStatus === 'Late' ? '<div class="banner warn">' + t('late_badge') + '</div>' : '<div class="banner ok">' + t('ontime') + '</div>';
  setApp('<button class="link" data-act="cancelins">← ' + t('scan_cancel') + '</button><h1 class="title">' + esc(nm(room)) + '</h1>' +
    '<p class="muted">' + t('insp_title') + (d.round ? ' · ' + t('round') + ' ' + esc(roundName(d.round)) + ' (' + d.round.start + ' – ' + d.round.end + ')' : '') + '</p>' + badge +
    d.items.map(function (it, n) { return '<div class="item" id="it_' + esc(it.itemId) + '"></div>'; }).join('') +
    '<label>' + t('photo_for_room') + ' <span id="photo_req"></span></label><div id="ins_photo"></div>' +
    '<label>' + t('overall_note') + '</label><textarea id="ins_note" maxlength="300" data-in="insnote"></textarea>' +
    '<div class="sticky"><div class="muted" id="ins_prog"></div><button class="btn p c" id="ins_submit" data-act="inssubmit" disabled></button></div>');
  d.items.forEach(drawItem);
  drawPhoto('ins_photo', I.photo, true, function (v) { I.photo = v; updateInsFooter(); });
  updateInsFooter();
  var iv = setInterval(updateInsFooter, 1000); cleanups.push(function () { clearInterval(iv); });
};
function drawItem(it) {
  var I = S.ins, a = I.answers[it.itemId], el = $('#it_' + it.itemId); if (!el) return;
  var opts = OPTS[it.type] || OPTS.check;
  el.innerHTML = '<div class="q">' + esc(itemText(it)) + '</div><div class="seg">' + opts.map(function (o) {
    return '<button data-act="ans" data-i="' + esc(it.itemId) + '" data-v="' + o[0] + '" class="' + (a === o[0] ? 'sel ' + o[2] : '') + '">' + t(o[1]) + '</button>';
  }).join('') + '</div>' +
    (needsNote(a) ? '<div class="nb"><input data-in="insitemnote" data-i="' + esc(it.itemId) + '" maxlength="200" placeholder="' + esc(t('note_ph')) + '" value="' + esc(I.notes[it.itemId] || '') + '"></div>' : '');
}
ACT.ans = function (el) {
  var I = S.ins, id = el.dataset.i, it = I.data.items.filter(function (x) { return x.itemId === id; })[0];
  I.answers[id] = el.dataset.v; drawItem(it); updateInsFooter();
  if (needsNote(el.dataset.v)) { var n = $('#it_' + id + ' input'); if (n) n.focus(); }
};
INP.insitemnote = function (el) { S.ins.notes[el.dataset.i] = el.value; updateInsFooter(); };
INP.insnote = function (el) { S.ins.note = el.value; };
function insState() {
  var I = S.ins, d = I.data, answered = 0, hard = false, notesOk = true;
  d.items.forEach(function (it) {
    var a = I.answers[it.itemId]; if (!a) return; answered++;
    if (needsNote(a)) { hard = true; if ((I.notes[it.itemId] || '').trim().length < 3) notesOk = false; }
  });
  var photoNeed = !!(d.room.photoRequired || hard);
  var left = Math.max(0, Math.ceil(d.minSeconds - (Date.now() - I.t0) / 1000));
  return { answered: answered, total: d.items.length, notesOk: notesOk, photoNeed: photoNeed, left: left, all: answered === d.items.length };
}
function updateInsFooter() {
  if (S.view !== 'inspect' || !S.ins) return;
  var s = insState(), b = $('#ins_submit'); if (!b) return;
  var pr = $('#photo_req'); if (pr) pr.textContent = s.photoNeed ? '(' + t('photo_req') + ')' : '';
  var ok = s.all && s.notesOk && (!s.photoNeed || S.ins.photo) && s.left === 0;
  b.disabled = !ok;
  b.textContent = s.left > 0 ? t('wait_s', { s: s.left }) : t('submit');
  var msg = t('answered', { a: s.answered, n: s.total });
  if (s.all && !s.notesOk) msg += ' · ' + t('need_notes');
  else if (s.all && s.photoNeed && !S.ins.photo) msg += ' · ' + t('photo_req');
  $('#ins_prog').textContent = msg;
}
ACT.cancelins = function () { S.ins = null; go('staff', { tab: 'today' }, true); };
ACT.inssubmit = async function (el) {
  var I = S.ins, s = insState(); if (!s.all) return;
  el.disabled = true; el.textContent = t('saving');
  try {
    var j = await api('submitInspection', {
      startToken: I.token, photo: I.photo || undefined, note: I.note,
      answers: I.data.items.map(function (it) { return { itemId: it.itemId, v: I.answers[it.itemId], note: needsNote(I.answers[it.itemId]) ? (I.notes[it.itemId] || '').trim() : '' }; })
    });
    S.done = { res: j, room: I.data.room, round: I.data.round }; S.ins = null; S.cache.inv = S.cache.inv; go('done', {}, true);
  } catch (e) {
    toast(errMsg(e)); updateInsFooter();
    if (e && (e.code === 'dup' || e.code === 'used' || e.code === 'expired')) { S.ins = null; setTimeout(function () { go('staff', { tab: 'today' }, true); }, 1800); }
  }
};
VIEWS.done = function () {
  var d = S.done; if (!d) { go('staff', { tab: 'today' }, true); return; }
  var n = d.res.concerns.length;
  setApp('<h1 class="title">' + t('done_title') + '</h1><div class="banner ok" style="font-size:18px">✓ ' + esc(nm(d.room)) + (d.round ? ' · ' + esc(d.round.roundId) : '') + '</div>' +
    (n ? '<div class="banner warn">' + t('done_concerns', { n: n }) + ': ' + esc(d.res.concerns.join(', ')) + '</div>' : '') +
    '<div class="stack"><button class="btn p" data-act="scan">' + t('done_next') + '</button><button class="btn" data-act="todaybtn">' + t('done_today') + '</button></div>');
};
ACT.todaybtn = function () { go('staff', { tab: 'today' }, true); };

/* ===================== dashboard ===================== */
function pctBar(p) { return '<div class="bar"><i class="' + (p === null ? '' : p < 60 ? 'lo' : p < 85 ? 'mid' : '') + '" style="width:' + (p || 0) + '%"></i></div>'; }
VIEWS.dash = async function (tok) {
  if (!isMgr()) { go('staff', { tab: 'more' }, true); return; }
  var d = await api('dashboard'); if (tok !== S.rtok) return;
  S.dash = d; var c = d.concerns;
  setApp(backBtn() + '<h1 class="title">' + t('dash_title') + '</h1>' +
    '<div class="stats"><div class="stat"><b>' + (d.month_.pct === null ? '–' : d.month_.pct + '%') + '</b><span>' + t('d_month') + '</span></div><div class="stat"><b>' + (c.open + c.inProgress) + '</b><span>' + t('d_open') + '</span></div><div class="stat"><b>' + (c.avgCloseHours === null ? '–' : c.avgCloseHours + t('hours')) + '</b><span>' + t('d_avg') + '</span></div></div>' +
    '<button class="btn c" data-act="copyweek">' + t('copy_week') + '</button>' +
    '<h2>' + t('d_rooms') + '</h2>' + d.rooms.map(function (r) {
      return '<div class="card"><div class="row"><span>' + esc(nm(r)) + '</span><b>' + (r.totals.pct === null ? '–' : r.totals.pct + '%') + '</b></div>' + pctBar(r.totals.pct) + '</div>';
    }).join('') +
    (c.repeat.length ? '<h2>' + t('d_repeat') + '</h2><div class="card">' + c.repeat.map(function (r) { return '<div class="row"><span>' + esc(nm(r.room)) + '</span><b>' + r.count + '</b></div>'; }).join('') + '</div>' : '') +
    '<h2>' + t('d_user') + '</h2><div class="card">' + (d.byUser.map(function (u) { return '<div class="row"><span>' + esc(u.name) + '</span><b>' + u.count + (u.late ? ' <small class="muted">(' + u.late + ' ' + t('late').toLowerCase() + ')</small>' : '') + '</b></div>'; }).join('') || '<span class="muted">' + t('no_data') + '</span>') + '</div>' +
    (d.fast.length ? '<h2>' + t('d_fast') + '</h2><div class="banner warn">' + d.fast.map(function (f) { return esc(f.name) + ' · ' + f.gapSec + 's · ' + esc(f.rooms.join(' → ')) + ' · ' + esc(f.ts.slice(11, 16)); }).join('<br>') + '</div>' : ''));
};
ACT.copyweek = function () {
  var txt = S.dash && S.dash.weeklyText || '';
  var done = function () { toast(t('copied')); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { modal('<p>' + esc(txt) + '</p>'); });
  else modal('<p>' + esc(txt) + '</p>');
};

/* ===================== QR labels ===================== */
function defaultBase() {
  var b = ls('hk_base'); if (b) return b;
  try { return (S.cfg && S.cfg.appUrl) || (location.origin + location.pathname.replace(/index\.html$/, '')); } catch (e) { return ''; }
}
function qrSvg(text) {
  var q = qrcode(0, 'M'); q.addData(text); q.make();
  var n = q.getModuleCount(), path = '';
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) path += 'M' + (c + 2) + ' ' + (r + 2) + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + path + '" fill="#111"/></svg>';
}
VIEWS.labels = async function (tok) {
  if (!S.user || S.user.role !== 'admin') { go('staff', { tab: 'more' }, true); return; }
  var j = await api('labels'); if (tok !== S.rtok) return;
  S.labels = j.rooms;
  setApp('<div class="noprint">' + backBtn() + '<h1 class="title">' + t('labels_title') + '</h1><label>' + t('labels_url') + '</label><input id="lb_base" value="' + esc(defaultBase()) + '">' +
    '<div class="wrap" style="margin:10px 0"><button class="btn s" data-act="lbmake">' + t('label_make') + '</button><button class="btn s p" data-act="print">' + t('label_print') + '</button></div><p class="muted">' + t('labels_note') + '</p></div><div id="lb_grid" class="label-grid"></div>');
  drawLabels();
};
function drawLabels() {
  var base = ($('#lb_base').value || '').trim(); if (base.indexOf('?') >= 0) base = base.split('?')[0];
  ls('hk_base', base);
  $('#lb_grid').innerHTML = S.labels.map(function (r) {
    var url = base + (base.slice(-1) === '/' || /\.html$/.test(base) ? '' : '/') + '?room=' + encodeURIComponent(r.roomId) + '&k=' + encodeURIComponent(r.key);
    return '<div class="label"><div class="bar2"></div>' + qrSvg(url) + '<h3>' + esc(r.nameEn) + '</h3>' + (r.nameId !== r.nameEn ? '<div class="ln">' + esc(r.nameId) + '</div>' : '') +
      '<div class="code">' + esc(r.roomId) + '</div><div class="ln">' + t('label_l1') + '</div><div class="ln">' + t('label_l2') + '</div><div class="ln" style="color:#777">' + t('label_l3') + '</div></div>';
  }).join('');
}
ACT.lbmake = drawLabels;


/* ===================== call / WhatsApp / HR ===================== */
function telNum(v) { return String(v || '').replace(/[^0-9+]/g, ''); }
function waNum(v) { var d = String(v || '').replace(/[^0-9]/g, ''); if (/^0/.test(d)) d = '62' + d.slice(1); return d; }
ACT.call = async function (el) {
  var cfg = await ensureCfg(), c = cfg.contacts || {}, rid = el && el.dataset && el.dataset.room;
  var room = rid ? cfg.rooms.filter(function (r) { return r.roomId === rid; })[0] : null;
  var text = room ? encodeURIComponent(t('call_wa_text', { r: nm(room) })) : '';
  function grp(title, phone, wa) {
    if (!phone && !wa) return '';
    return '<h2>' + esc(title) + '</h2><div class="stack">' +
      (phone ? '<a class="btn" href="tel:' + esc(telNum(phone)) + '" style="text-decoration:none;text-align:center;display:block">' + t('call_call') + ' · ' + esc(phone) + '</a>' : '') +
      (wa ? '<a class="btn" href="https://wa.me/' + esc(waNum(wa)) + '?text=' + text + '" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;display:block">' + t('call_wa') + '</a>' : '') + '</div>';
  }
  var body = grp(t('call_hk'), c.hkPhone, c.hkWa) + grp(t('call_hr'), c.hrPhone, c.hrWa);
  modal('<h3>' + t('call_title') + '</h3>' + (body || '<p class="muted">' + t('call_none') + '</p>') + '<button class="btn c" data-act="mclose" style="margin-top:12px">' + t('ok') + '</button>');
};

/* ===================== global wiring ===================== */
ACT.mclose = closeModal;
ACT.home = function () { if (S.view !== 'home') go('home'); };
ACT.back = function () { if (history.length > 1 && history.state) history.back(); else go('home', {}, true); };
ACT.go = function (el) { go(el.dataset.v); };
ACT.retry = function () { render(); };
ACT.lang = function (el) { S.lang = el.dataset.l; ls('hk_lang', S.lang); render(); };

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act],[data-stop]');
  if (!el) return;
  if (!el.dataset.act) return;
  var f = ACT[el.dataset.act];
  if (f) { e.preventDefault(); try { var r = f(el, e); if (r && r.catch) r.catch(function (x) { toast(errMsg(x)); }); } catch (x) { toast(errMsg(x)); } }
});
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el);
});
document.addEventListener('change', function (e) {
  var el = e.target.closest('select[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && S.token) doPulse(); });

/* ===================== boot ===================== */
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
(function boot() {
  var i = initialRoute();
  S.view = i.view; S.params = i.params;
  try { history.replaceState({ view: S.view, params: S.params }, ''); } catch (e) {}
  if (S.token) startPulse();
  render();
})();
})();
</script>
